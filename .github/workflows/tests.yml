# TODO: Remove this workflow before moving to the public repo.

name: Test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::370957321024:role/S3EC-Python-Github-test-role
          role-session-name: S3ECNetTests

      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Run Unit Tests (.NET Framework 4.7.2 and .NET 8)
        if: runner.os == 'Windows'
        run: dotnet test --no-restore --no-build test/UnitTests/Amazon.Extensions.S3.Encryption.UnitTests.csproj
      
      # .NET Framework 4.7.2 is not supported in mac
      - name: Run Unit Tests (Only .NET 8)
        if: runner.os == 'macOS'
        run: dotnet test --no-restore --no-build --framework net8.0 test/UnitTests/Amazon.Extensions.S3.Encryption.UnitTests.csproj
      
      # .NET Framework 4.7.2 is not supported in mac
      - name: Run Integration Tests (.NET Framework 4.7.2)
        if: runner.os == 'Windows'
        run: dotnet test --no-restore --no-build test/IntegrationTests/Amazon.Extensions.S3.Encryption.IntegrationTests.NetFramework.csproj

      - name: Run Integration Tests (.NET 8)
        run: dotnet test --no-restore --no-build test/IntegrationTests/Amazon.Extensions.S3.Encryption.IntegrationTests.NetStandard.csproj --blame-hang-timeout 5m